name: Build LineageOS 23 for munch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Packages
        run: |
          sudo apt update
          sudo apt install -y repo git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc unzip

      - name: Init Repo
        run: |
          repo init -u https://github.com/LineageOS/android.git -b lineage-23.0
          repo sync -j8

      - name: Build ROM
        run: |
          . build/envsetup.sh
          lunch lineage_munch-userdebug
          mka bacon -j$(nproc)

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lineage-23-munch
          path: out/target/product/munch/*.zip
